$kind: http-request
url: "{{baseUrl}}/api/events?city=Postman%20Test%20City&role=Event%20Helper&skill=first-aid"
method: GET
queryParams:
  - key: city
    value: Postman%20Test%20City
  - key: role
    value: Event%20Helper
  - key: skill
    value: first-aid
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test('Response is valid JSON', function () { pm.response.to.be.json; });
      const rows=pm.response.json().data; pm.test('New event appears in discovery',()=>pm.expect(rows.some(e=>e.id===pm.collectionVariables.get('eventId'))).to.eql(true));
    language: text/javascript
order: 19000
