$kind: http-request
url: "{{baseUrl}}/api/applications/{{applicationId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "decision": "APPROVED",
      "note": "Approved by the local API test."
    }
auth:
  type: bearer
  credentials:
    token: "{{organizerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test('Response is valid JSON', function () { pm.response.to.be.json; });
      pm.test('Application is approved',()=>pm.expect(pm.response.json().data.status).to.eql('APPROVED'));
    language: text/javascript
order: 23000
