$kind: http-request
url: "{{baseUrl}}/api/events/{{eventId}}/cancel"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Temporary event cleanup after API workflow test."
    }
auth:
  type: bearer
  credentials:
    token: "{{organizerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test('Response is valid JSON', function () { pm.response.to.be.json; });
      pm.test('Event is cancelled',()=>pm.expect(pm.response.json().data.status).to.eql('CANCELLED'));
    language: text/javascript
order: 29000
