$kind: http-request
url: "{{baseUrl}}/api/me/notifications/{{notificationId}}/read"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{volunteerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test('Response is valid JSON', function () { pm.response.to.be.json; });
      pm.test('Notification is marked read',()=>pm.expect(pm.response.json().data.readAt).to.exist);
    language: text/javascript
order: 26000
