$kind: http-request
url: "{{baseUrl}}/api/organizers/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{organizerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test('Response is valid JSON', function () { pm.response.to.be.json; });
      pm.test('Organizer is approved',()=>pm.expect(pm.response.json().data.verificationStatus).to.eql('APPROVED'));
    language: text/javascript
order: 9000
