$kind: http-example
name: Volunteer profile updated.
request:
  url: "{{baseUrl}}/api/me/volunteer-profile"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "homeCity": "string",
        "locality": "string",
        "skills": [
          "string",
          "string"
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
