$kind: http-request
description: ""
url: "{{baseUrl}}/api/applications/:applicationId"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: applicationId
    value: string
    disabled: false
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "decision": "REJECTED",
      "note": "string"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/decide Application.resources/examples
order: 1000
