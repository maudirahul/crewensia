$kind: http-example
name: The requested resource was not found.
request:
  url: "{{baseUrl}}/api/admin/organizer-verifications/:requestId"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: requestId
      value: string
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "decision": "REJECTED",
        "notes": "string"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "string",
          "message": "string"
        }
      }
order: 3000
