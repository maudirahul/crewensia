$kind: http-example
name: Admin access required.
request:
  url: "{{baseUrl}}/api/admin/organizer-verifications/:requestId"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: requestId
      value: string
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "decision": "REJECTED",
        "notes": "string"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 2000
