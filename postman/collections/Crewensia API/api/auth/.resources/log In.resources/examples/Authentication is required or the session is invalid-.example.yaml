$kind: http-example
name: Authentication is required or the session is invalid.
request:
  url: "{{baseUrl}}/api/auth/login"
  method: POST
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "Cth2B@nZueCGiprDRnXqGSIffoGMFFcHNscc.sxc",
        "password": "string"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "string",
          "message": "string"
        }
      }
order: 2000
