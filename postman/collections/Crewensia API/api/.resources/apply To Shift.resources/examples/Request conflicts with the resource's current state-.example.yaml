$kind: http-example
name: Request conflicts with the resource's current state.
request:
  url: "{{baseUrl}}/api/shifts/:shiftId/applications"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: shiftId
      value: string
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "message": "string"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "string",
          "message": "string"
        }
      }
order: 3000
