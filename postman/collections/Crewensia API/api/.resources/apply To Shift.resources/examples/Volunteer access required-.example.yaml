$kind: http-example
name: Volunteer access required.
request:
  url: "{{baseUrl}}/api/shifts/:shiftId/applications"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: shiftId
      value: string
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "message": "string"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 2000
