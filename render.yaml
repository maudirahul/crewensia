databases:
  - name: crewensia-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: crewensia
    user: crewensia

services:
  - type: web
    name: crewensia-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crewensia-db
          property: connectionString
      - key: API_PORT
        value: "3000"
      - key: CLIENT_ORIGIN
        value: https://crewensia.in,https://www.crewensia.in
