services:
  - type: pserv
    name: crewensia-db
    plan: free
    databaseName: crewensia
    user: crewensia
  - type: web
    name: crewensia-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crewensia-db
          property: connectionString
      - key: CLIENT_ORIGIN
        value: http://localhost:5173
