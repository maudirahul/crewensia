services:
  postgres:
    image: postgres:17-alpine
    container_name: crewensia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crewensia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crewensia}
      POSTGRES_DB: ${POSTGRES_DB:-crewensia}
    ports:
      - "5433:5432"
    volumes:
      - crewensia-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crewensia} -d ${POSTGRES_DB:-crewensia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: crewensia-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crewensia}:${POSTGRES_PASSWORD:-crewensia}@postgres:5432/${POSTGRES_DB:-crewensia}?schema=public
      API_PORT: 3000
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: crewensia-client
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://server:3000
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy

volumes:
  crewensia-postgres-data:
